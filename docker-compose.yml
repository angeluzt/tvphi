services:
  postgres:
    image: postgres:16-alpine
    container_name: tvphi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tvphi
      POSTGRES_PASSWORD: tvphi
      POSTGRES_DB: tvphi
    ports:
      - "5432:5432"
    volumes:
      - tvphi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvphi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tvphi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tvphi_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tvphi_pg:
  tvphi_redis:
