services:
  postgres:
    image: postgres:16-alpine
    container_name: tvphi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tvphi
      POSTGRES_PASSWORD: tvphi
      POSTGRES_DB: tvphi
    ports:
      - "5432:5432"
    volumes:
      - tvphi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvphi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tvphi_pg:
